version: '3.8'

services:
  brandguard-ai:
    build: .
    container_name: brandguard-app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=production_super_secret_jwt_key_hackathon_2026
      - CLIENT_ORIGIN=http://localhost:5000
      - AI_PROVIDER=demo
    volumes:
      - brandguard-data:/app/server/prisma
      - brandguard-uploads:/app/server/uploads

volumes:
  brandguard-data:
  brandguard-uploads:
