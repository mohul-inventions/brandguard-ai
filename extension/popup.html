<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BrandGuard AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body { width: 360px; min-height: 480px; background: #0f172a; color: #f8fafc; padding: 16px; font-size: 13px; }
    .header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 12px; border-bottom: 1px solid #1e293b; margin-bottom: 14px; }
    .logo-badge { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; color: #38bdf8; }
    .status-pill { font-size: 10px; padding: 2px 6px; border-radius: 999px; background: #065f46; color: #6ee7b7; font-weight: 600; }
    .card { background: #1e293b; border-radius: 8px; padding: 12px; margin-bottom: 12px; border: 1px solid #334155; }
    .score-circle { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px 0; }
    .score-num { font-size: 38px; font-weight: 800; color: #38bdf8; line-height: 1; }
    .score-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: #94a3b8; margin-top: 4px; }
    .finding-item { padding: 8px; border-radius: 6px; background: #0f172a; margin-top: 8px; border-left: 3px solid #ef4444; }
    .finding-item.warning { border-left-color: #f59e0b; }
    .finding-title { font-weight: 600; color: #f8fafc; font-size: 12px; margin-bottom: 2px; }
    .finding-fix { font-size: 11px; color: #38bdf8; margin-top: 4px; cursor: pointer; }
    .btn { display: block; width: 100%; padding: 8px; background: #2563eb; color: #ffffff; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; text-align: center; margin-top: 8px; }
    .btn:hover { background: #1d4ed8; }
    .btn-secondary { background: #334155; color: #cbd5e1; }
    .btn-secondary:hover { background: #475569; }
    .input-field { width: 100%; padding: 7px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #f8fafc; font-size: 12px; margin-top: 4px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-badge">
      🛡️ BrandGuard AI
    </div>
    <span id="connStatus" class="status-pill">Ready</span>
  </div>

  <div id="loginView" class="card" style="display: none;">
    <div style="font-weight: 600; margin-bottom: 8px;">Connect to BrandGuard</div>
    <input type="text" id="apiUrlInput" class="input-field" placeholder="Backend API URL" value="http://localhost:5000/api">
    <button id="demoLoginBtn" class="btn">1-Click Demo Login (NovaTech)</button>
  </div>

  <div id="scannerView">
    <div class="card">
      <div class="score-circle">
        <div id="scoreDisplay" class="score-num">--</div>
        <div class="score-label">Brand Compliance Score</div>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 11px; color: #94a3b8; border-top: 1px solid #334155; padding-top: 8px;">
        <span>Critical: <strong id="critCount" style="color: #ef4444;">0</strong></span>
        <span>High: <strong id="highCount" style="color: #f59e0b;">0</strong></span>
        <span>Passed Rules: <strong id="passedCount" style="color: #10b981;">0</strong></span>
      </div>
    </div>

    <button id="scanActiveTabBtn" class="btn">Scan Active Page / Selection</button>

    <div style="margin-top: 14px; font-weight: 600; font-size: 12px; color: #cbd5e1;">Live Findings (<span id="findingCount">0</span>)</div>
    <div id="findingsList" style="max-height: 180px; overflow-y: auto; margin-top: 6px;">
      <div style="color: #64748b; font-size: 11px; text-align: center; padding: 16px;">
        Click "Scan Active Page" or type inside Google Docs, WordPress, or LinkedIn to inspect copy.
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
